<!doctype html>
<html lang="uz" data-variant="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRADE UNIVERSAL FOOD</title>
<meta name="description" content="TRADE UNIVERSAL FOOD МЧЖ: 2018 йилдан буён ташкилот ва корхоналарга сифатли хизматлар.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a href="#home" class="brand" aria-label="TRADE UNIVERSAL FOOD"><img src="assets/mark.jpg" alt=""><span>TRADE UNIVERSAL FOOD</span></a>
    <nav class="menu" aria-label="Menu">
      <a href="#home" data-t="nav_home"></a>
      <a href="#team" data-t="nav_team"></a>
      <a href="#work" data-t="nav_work"></a>
      <a href="#cars" data-t="nav_cars"></a>
      <a href="#cert" data-t="nav_cert"></a>
      <a href="#about" data-t="nav_about"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
    </div>
    <a href="#contact" class="btn btn-sm cta-top" data-t="cta"></a>
    <button class="burger" aria-label="Menu" aria-expanded="false"><i class="ph ph-list"></i></button>
  </div>
</header>

<main>
  <section id="home" class="sec hero" data-bg="hero">
    <div class="wrap hero-in">
      <div class="hero-text reveal">
        <p class="since" data-t="since"></p>
        <h1><span class="brandline">TRADE UNIVERSAL FOOD</span><span class="tag" data-t="hero_tag"></span></h1>
        <p class="lead" data-t="hero_p1"></p>
        <a href="#contact" class="btn" data-t="cta"></a>
      </div>
      <div class="hero-logo reveal"><img src="assets/logo.jpg" alt="TRADE UNIVERSAL FOOD logo" width="860" height="785"></div>
    </div>
    <div class="wrap segs reveal">
      <p class="segs-p" data-t="hero_p2"></p>
      <ul class="seg-list">
        <li><i class="ph ph-soccer-ball"></i><span data-t="seg1"></span></li>
        <li><i class="ph ph-first-aid-kit"></i><span data-t="seg2"></span></li>
        <li><i class="ph ph-shield-star"></i><span data-t="seg3"></span></li>
        <li><i class="ph ph-hard-hat"></i><span data-t="seg4"></span></li>
      </ul>
    </div>
  </section>

  <section id="team" class="sec" data-bg="soft">
    <div class="wrap">
      <h2 class="reveal" data-t="team_h"></h2>
      <div class="team reveal" id="teamGrid"></div>
    </div>
  </section>

  <section id="work" class="sec" data-bg="base">
    <div class="wrap">
      <h2 class="reveal" data-t="work_h"></h2>
      <p class="hint reveal" data-t="work_hint"></p>
    </div>
    <div class="strip-wrap reveal">
      <button class="strip-nav prev" aria-label="Back"><i class="ph ph-caret-left"></i></button>
      <div class="strip" id="strip" tabindex="0"></div>
      <button class="strip-nav next" aria-label="Next"><i class="ph ph-caret-right"></i></button>
    </div>
    <div class="wrap"><div class="detail" id="detail" aria-live="polite" hidden></div></div>
  </section>

  <section id="cars" class="sec" data-bg="accent">
    <div class="wrap">
      <h2 class="reveal" data-t="cars_h"></h2>
      <div class="cars reveal">
        <article class="car car-big"><div class="ph-img"><i class="ph ph-truck"></i><span data-t="ph_photo"></span></div><div class="car-info"><b class="num">2</b><span data-t="car1"></span></div></article>
        <article class="car"><div class="ph-img"><i class="ph ph-truck-trailer"></i><span data-t="ph_photo"></span></div><div class="car-info"><b class="num">1</b><span data-t="car2"></span></div></article>
        <article class="car"><div class="ph-img"><i class="ph ph-car-profile"></i><span data-t="ph_photo"></span></div><div class="car-info"><b class="num">5</b><span><span data-t="car3"></span><small data-t="car3_note"></small></span></div></article>
      </div>
    </div>
  </section>

  <section id="cert" class="sec" data-bg="dark">
    <div class="wrap cert">
      <a class="cert-img reveal" href="assets/guvohnoma.jpg" target="_blank" rel="noopener"><img src="assets/guvohnoma.jpg" alt="Guvohnoma" loading="lazy"></a>
      <div class="cert-text reveal">
        <h2 data-t="cert_h"></h2>
        <dl class="req">
          <div><dt data-t="r_name"></dt><dd>"TRADE UNIVERSAL FOOD" MAS'ULIYATI CHEKLANGAN JAMIYAT</dd></div>
          <div><dt data-t="r_stir"></dt><dd class="mono">305 827 492</dd></div>
          <div><dt data-t="r_date"></dt><dd class="mono">29.10.2018</dd></div>
          <div><dt data-t="r_addr"></dt><dd data-t="r_addr_v"></dd></div>
        </dl>
      </div>
    </div>
  </section>

  <section id="about" class="sec" data-bg="base">
    <div class="wrap about">
      <h2 class="reveal" data-t="about_h"></h2>
      <div class="about-cols reveal">
        <div class="about-text">
          <p data-t="about_p1"></p>
          <p data-t="about_p2"></p>
          <p data-t="about_p3"></p>
        </div>
        <ul class="princ">
          <li><i class="ph ph-seal-check"></i><span data-t="pr1"></span></li>
          <li><i class="ph ph-handshake"></i><span data-t="pr2"></span></li>
          <li><i class="ph ph-shield-check"></i><span data-t="pr3"></span></li>
          <li><i class="ph ph-clock"></i><span data-t="pr4"></span></li>
        </ul>
      </div>
      <p class="slogan reveal" data-t="slogan"></p>
    </div>
  </section>

  <section id="contact" class="sec" data-bg="soft">
    <div class="wrap contact">
      <div class="reveal">
        <h2 data-t="contact_h"></h2>
        <ul class="c-list">
          <li><i class="ph ph-phone"></i><span><small data-t="c_phone"></small><b class="todo" data-t="ph_contact"></b></span></li>
          <li><i class="ph ph-telegram-logo"></i><span><small data-t="c_tg"></small><b class="todo" data-t="ph_contact"></b></span></li>
          <li><i class="ph ph-map-pin"></i><span><small data-t="c_addr"></small><b data-t="r_addr_v"></b></span></li>
        </ul>
      </div>
      <form class="form reveal" onsubmit="return false">
        <label><span data-t="f_name"></span><input name="name" autocomplete="name" required></label>
        <label><span data-t="f_org"></span><input name="org" autocomplete="organization"></label>
        <label><span data-t="f_phone"></span><input name="phone" type="tel" autocomplete="tel" required></label>
        <label><span data-t="f_msg"></span><textarea name="msg" rows="3"></textarea></label>
        <button class="btn" type="submit" disabled data-t="f_send"></button>
        <p class="f-note" data-t="f_note"></p>
      </form>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <span>© 2018-2026 TRADE UNIVERSAL FOOD МЧЖ</span>
    <span>STIR 305 827 492</span>
    <span data-t="foot"></span>
  </div>
</footer>

<div class="variant-switch" aria-label="Preview variant">
  <button data-v="a">A</button><button data-v="b">B</button><button data-v="c">C</button><button data-v="d">D</button>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
